chgres_cube_gsd_defaults: &chgres_cube_gsd_defaults
  namelist:
    update_values:
      config:
        varmap_file: "{{ user.PARMdir }}/ufs_utils/varmap_tables/GSDphys_var_map.txt"

orog_gsl_defaults: &orog_gsl_defaults
  config:
    halo: 4
    input_grid_file: "{{ workflow.FIXlam }}/{{ 'CRES' | env }}_grid.tile7.halo{{ grid_params.NHW }}.nc"
    resolution: !int "{{ ('CRES' | env )[1:] }}"
    tile: 7
    topo_data_2p5m: "{{ workflow.FIXam }}/geo_em.d01.lat-lon.2.5m.HGT_M.nc"
    topo_data_30s: "{{ workflow.FIXam }}/HGT.Beljaars_filtered.lat-lon.30s_res.nc"
  execution:
    batchargs:
      nodes: 1
      tasks_per_node: 1
      walltime: 00:10:00
    executable: "{{ user.EXECdir }}/orog_gsl"
    envcmds:
      - module use {{ user.HOMEdir }}/modulefiles
      - module load build_{{ user.MACHINE|lower }}_{{ workflow.COMPILER }}
  rundir: "{{ task_make_orog.rundir }}/orog_gsl"

run_fcst_hrrr_fix_files:
  files_to_link: &FV3_HRRR_fix_files
    INPUT/oro_data_ls.nc: '{{ workflow.FIXlam }}/{{ "CRES" | env }}_oro_data_ls.tile7.halo{{ constants.NH0 }}.nc'
    INPUT/oro_data_ss.nc: '{{ workflow.FIXlam }}/{{ "CRES" | env }}_oro_data_ss.tile7.halo{{ constants.NH0 }}.nc'

fv3_nml_gfs_gfdl_cloud_mp_defaults:
  gfdl_cloud_microphysics_nml: &gfs_gfdl_cloud_mp
    c_cracw: 0.8
    c_paut: 0.5
    c_pgacs: 0.01
    c_psaci: 0.05
    ccn_l: 300.0
    ccn_o: 100.0
    const_vg: False
    const_vi: False
    const_vr: False
    const_vs: False
    de_ice: False
    do_qa: True
    do_sedi_heat: False
    dw_land: 0.16
    dw_ocean: 0.1
    fast_sat_adj: True
    fix_negative: True
    icloud_f: 1
    mono_prof: True
    mp_time: 90.0
    prog_ccn: False
    qi0_crt: 8.0e-05
    qi_lim: 1.0
    ql_gen: 0.001
    ql_mlt: 0.001
    qs0_crt: 0.001
    rad_graupel: True
    rad_rain: True
    rad_snow: True
    rh_inc: 0.3
    rh_inr: 0.3
    rh_ins: 0.3
    rthresh: 1.0e-05
    sedi_transport: False
    tau_g2v: 900.0
    tau_i2s: 1000.0
    tau_l2v: 180.0
    tau_v2l: 90.0
    use_ccn: True
    use_ppm: False
    vg_max: 12.0
    vi_max: 1.0
    vr_max: 12.0
    vs_max: 2.0
    z_slope_ice: True
    z_slope_liq: True


