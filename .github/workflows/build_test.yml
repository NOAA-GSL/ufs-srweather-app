# This workflow Builds the UFS Short Range Weather APP
name: Build SRWA

on:
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

# Use a default login shell which loads intel/oneapi/setvars.sh, and lmod path 
defaults:
  run:
    shell: bash -l {0}

jobs:

  Clone_SRWA:
    name: Clone Repo
    if: ${{ github.event.label.name == 'ci-aws-intel-build' }}
    runs-on: self-hosted 
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Verify Branch 
        run: |
          git branch 
  
  Build_SRWA:
    name: Build SRWA 
    if: ${{ github.event.label.name == 'ci-aws-intel-build' }}
    runs-on: self-hosted
    needs: Clone_SRWA

    steps:
      - name: Build Short Range Weather App using test/build.sh
        run: |
          ./manage_externals/checkout_externals
          cd test/
          ./build.sh aws >& build_test.out
          cat build_test*
